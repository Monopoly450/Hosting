server {
    listen 8081;
    server_name localhost;

    # Отключаем лимит на размер загружаемых файлов для ISO/QCOW2 образов
    client_max_body_size 0;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Проксирование REST API запросов к FastAPI бэкенду
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование запросов к Go-оркестратору Aegis-HCI
    location /api/aegis {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Отключаем буферизацию Nginx для стабильной трансляции SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Проксирование WebSocket соединений (VNC консоль)
    location /api/vnc {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
