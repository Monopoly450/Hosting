apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: template-windows
  namespace: default
  labels:
    hosting.antigravity.io/template: "windows"
spec:
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/domain: template-windows
    spec:
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 4Gi
        features:
          acpi: {}
          apic: {}
          hyperv:
            relaxed: {}
            vapic: {}
            spinlocks:
              spinlocks: 8191
        devices:
          disks:
            - name: winhd
              disk:
                bus: virtio
            - name: winiso
              cdrom:
                bus: sata
            - name: virtio-drivers
              cdrom:
                bus: sata
          interfaces:
            - name: default
              masquerade: {}
            - name: bridge-net
              bridge: {}
          inputs:
            - type: tablet
              name: tablet
              bus: usb
      networks:
        - name: default
          pod: {}
        - name: bridge-net
          multus:
            networkName: bridge-network
      volumes:
        - name: winhd
          dataVolume:
            name: template-windows-hd
        - name: winiso
          dataVolume:
            name: template-windows-iso
        - name: virtio-drivers
          containerDisk:
            image: quay.io/kubevirt/virtio-container-disk
  dataVolumeTemplates:
    - metadata:
        name: template-windows-hd
      spec:
        source:
          blank: {}
        storage:
          storageClassName: "local-path"
          resources:
            requests:
              storage: 60Gi
    - metadata:
        name: template-windows-iso
      spec:
        source:
          http:
            url: "https://software-static.download.prss.microsoft.com/sg/download/details.aspx?uuid=5e4c6052-b13c-4384-9ff5-c439162e08e7" # Пример официальной ссылки на Windows Server 2022 Evaluation ISO
        storage:
          storageClassName: "local-path"
          resources:
            requests:
              storage: 6Gi
