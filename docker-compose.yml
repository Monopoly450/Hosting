version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aegis-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aegis
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hosting-backend
    network_mode: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Пробрасываем kubeconfig из K3s для авторизации в Kubernetes API
      - /etc/rancher/k3s/k3s.yaml:/root/.kube/config:ro
      # Пробрасываем Docker-сокет для администрирования контейнеров
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Папка для загрузки и хранения кастомных образов ОС и настроек серверов
      - ./data:/app/data:rw
      # Пробрасываем корень проекта для Git-интеграции
      - .:/app/repo:rw
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - IMAGES_DIR=/app/data/images
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/aegis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hosting-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aegis-orchestrator:
    build:
      context: ./aegis-orchestrator
      dockerfile: Dockerfile
    container_name: aegis-orchestrator
    network_mode: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:rw
    environment:
      - PORT=8001
      - DB_CONN_STR=postgresql://postgres:postgres@127.0.0.1:5432/aegis?sslmode=disable
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vds-frontend:
    build:
      context: ./vds
      dockerfile: Dockerfile
    container_name: vds-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:



