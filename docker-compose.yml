version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aegis-db
    ports:
      # Только localhost: снаружи системная БД не нужна (бэкенд работает в host-сети)
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=aegis
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hosting-rabbitmq
    ports:
      # Только localhost: очередью пользуются только backend и worker на этом же хосте
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?RABBITMQ_USER не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hosting-backend
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
      - SYS_CHROOT
    security_opt:
      - apparmor:unconfined
    pid: host
    # Доступ к устройствам для операций с LVM-пулом (изменение размера).
    # Одного nsenter в пространство монтирования хоста мало: cgroup устройств
    # действует на процесс, а не на пространство имён, поэтому открыть
    # /dev/mapper/control контейнеру всё равно запрещалось — pvresize падал с
    # «Operation not permitted», а размер /dev/loop0 читался нулевым, что LVM
    # сообщал как «device is too small (pv_min_size)».
    #
    # Правила точечные, а не privileged: 10:236 — узел device-mapper,
    # 7 — loop-устройства, 253/254 — блочные устройства device-mapper
    # (номер выделяется динамически, на практике один из этих двух).
    device_cgroup_rules:
      - "c 10:236 rwm"
      - "b 7:* rwm"
      - "b 253:* rwm"
      - "b 254:* rwm"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /etc/rancher/k3s/k3s.yaml:/root/.kube/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./data:/app/data:rw
      - .:/app/repo:rw
      - /var/lib/aegis:/var/lib/aegis:rw
      - /run/lvm:/run/lvm:rw
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - IMAGES_DIR=/app/data/images
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - AEGIS_SECRET_KEY=${AEGIS_SECRET_KEY:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - STORAGE_CLASS=${STORAGE_CLASS:-local-path}
      # Внешний адрес сервера: ссылки на приложения, адрес push в реестр и
      # цель A-записей доменов. Пусто — определяется автоматически.
      - AEGIS_HOST_IP=${AEGIS_HOST_IP:-}
      - REGISTRY_PORT=${REGISTRY_PORT:-5000}
      - ACME_EMAIL=${ACME_EMAIL:-}
      # Домены служебных сервисов (панель/почта/хранилище) и токен Timeweb
      # для DNS-01 — см. app/services/domains.py
      - PANEL_DOMAIN=${PANEL_DOMAIN:-}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-}
      - STORAGE_DOMAIN=${STORAGE_DOMAIN:-}
      - RABBITMQ_DOMAIN=${RABBITMQ_DOMAIN:-}
      - TIMEWEB_DNS_API_TOKEN=${TIMEWEB_DNS_API_TOKEN:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hosting-worker
    network_mode: host
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - NET_ADMIN
      - SYS_CHROOT
    security_opt:
      - apparmor:unconfined
    pid: host
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /etc/rancher/k3s/k3s.yaml:/root/.kube/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./data:/app/data:rw
      - .:/app/repo:rw
      - /var/lib/aegis:/var/lib/aegis:rw
      - /run/lvm:/run/lvm:rw
    environment:
      - IMAGES_DIR=/app/data/images
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - RABBITMQ_URL=${RABBITMQ_URL:?RABBITMQ_URL не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - AEGIS_SECRET_KEY=${AEGIS_SECRET_KEY:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - STORAGE_CLASS=${STORAGE_CLASS:-local-path}
      - AEGIS_HOST_IP=${AEGIS_HOST_IP:-}
      - REGISTRY_PORT=${REGISTRY_PORT:-5000}
      # Вотчдог Caddy (caddy_watchdog_tick) тикает именно в этом контейнере —
      # см. app/services/domains.py и worker.py.
      - ACME_EMAIL=${ACME_EMAIL:-}
      - PANEL_DOMAIN=${PANEL_DOMAIN:-}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-}
      - STORAGE_DOMAIN=${STORAGE_DOMAIN:-}
      - RABBITMQ_DOMAIN=${RABBITMQ_DOMAIN:-}
      - TIMEWEB_DNS_API_TOKEN=${TIMEWEB_DNS_API_TOKEN:-}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hosting-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aegis-orchestrator:
    build:
      context: ./aegis-orchestrator
      dockerfile: Dockerfile
    container_name: aegis-orchestrator
    network_mode: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:rw
    environment:
      - PORT=8001
      - DB_CONN_STR=${DB_CONN_STR:?DB_CONN_STR не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:10.11-jammy
    container_name: aegis-mariadb
    ports:
      # Только localhost: пользовательские БД теперь живут в изолированных K8s-подах
      - "127.0.0.1:3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    ports:
      # S3 API остаётся публичным: к нему подключаются ВМ и внешние клиенты
      - "9000:9000"
      # Консоль администратора MinIO — только localhost (доступ через SSH-туннель)
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD не задан в .env — задайте его (openssl rand -hex 24), см. .env.example}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailserver:
    image: mailserver/docker-mailserver:12.1.0
    container_name: aegis-mailserver
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    environment:
      # Домен почты берётся из MAIL_DOMAIN — того же, что привязывается через
      # scripts/add-domain.sh. Без него оставался зашитый aegis.local, и ящики
      # создавались на несуществующем домене: письма с них никуда не уходили,
      # а в подсказках интерфейса стоял пример user@domain.local.
      # aegis.local — запасной вариант для установок без своего домена.
      - OVERRIDE_HOSTNAME=${MAIL_DOMAIN:-mail.aegis.local}
      - DOMAINNAME=${MAIL_DOMAIN:-aegis.local}
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - SSL_TYPE=
      - PERMIT_DOCKER=network
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - ./mail-config:/tmp/docker-mailserver
    restart: unless-stopped

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: aegis-webmail
    ports:
      - "8082:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
    depends_on:
      - mailserver
    restart: unless-stopped

volumes:
  postgres_data:
  mariadb_data:
  minio_data:
  mail_data:
  mail_state:
