version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hosting-backend
    network_mode: host
    restart: unless-stopped
    volumes:
      # Пробрасываем kubeconfig из K3s для авторизации в Kubernetes API
      - /etc/rancher/k3s/k3s.yaml:/root/.kube/config:ro
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hosting-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
