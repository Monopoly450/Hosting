version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aegis-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aegis
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hosting-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hosting-backend
    network_mode: host
    privileged: true
    pid: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /etc/rancher/k3s/k3s.yaml:/root/.kube/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./data:/app/data:rw
      - .:/app/repo:rw
      - /var/lib/aegis:/var/lib/aegis:rw
      - /run/lvm:/run/lvm:rw
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - IMAGES_DIR=/app/data/images
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@localhost:5432/aegis}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@localhost:5672/}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hosting-worker
    network_mode: host
    privileged: true
    pid: host
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /etc/rancher/k3s/k3s.yaml:/root/.kube/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./data:/app/data:rw
      - .:/app/repo:rw
      - /var/lib/aegis:/var/lib/aegis:rw
      - /run/lvm:/run/lvm:rw
    environment:
      - IMAGES_DIR=/app/data/images
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@localhost:5432/aegis}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@localhost:5672/}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hosting-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aegis-orchestrator:
    build:
      context: ./aegis-orchestrator
      dockerfile: Dockerfile
    container_name: aegis-orchestrator
    network_mode: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:rw
    environment:
      - PORT=8001
      - DB_CONN_STR=${DB_CONN_STR}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:10.11-jammy
    container_name: aegis-mariadb
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-mariadb-root-secret-2026}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin-secret-2026}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailserver:
    image: mailserver/docker-mailserver:12.1.0
    container_name: aegis-mailserver
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
    environment:
      - OVERRIDE_HOSTNAME=mail.aegis.local
      - DOMAINNAME=aegis.local
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ONE_DIR=1
      - SSL_TYPE=
      - PERMIT_DOCKER=network
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - ./mail-config:/tmp/docker-mailserver
    restart: unless-stopped

  webmail:
    image: roundcube/roundcubemail:latest
    container_name: aegis-webmail
    ports:
      - "8082:80"
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=mailserver
      - ROUNDCUBEMAIL_SMTP_SERVER=mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
    depends_on:
      - mailserver
    restart: unless-stopped

volumes:
  postgres_data:
  mariadb_data:
  minio_data:
  mail_data:
  mail_state:
