# Общие location-блоки панели, подключаемые и в HTTPS-блок для прямого
# доступа (порт 8443), и в plain-HTTP блок для локального прокси Caddy
# (127.0.0.1:8081) — см. nginx.conf. Держим в одном месте, чтобы порты не
# расходились в поведении.

location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
}

# Кэширование статических файлов в браузере
location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|webp)$ {
    root /usr/share/nginx/html;
    expires 30d;
    add_header Cache-Control "public, no-transform";
    access_log off;
    log_not_found off;
}

# Проксирование REST API запросов к FastAPI бэкенду
location /api {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Проксирование запросов к Go-оркестратору Aegis-HCI
location /api/aegis {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Отключаем буферизацию Nginx для стабильной трансляции SSE
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
}

# Проксирование WebSocket соединений (VNC консоль)
location /api/vnc {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
}

# Проксирование WebSocket соединений (SSH терминал)
location /api/ssh-terminal {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
}
