server {
    listen 8080;
    server_name localhost;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Отключаем лимит на размер загружаемых файлов для ISO/QCOW2 образов
    client_max_body_size 0;

    # Включаем сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/nginx-locations.conf;
}

# Plain HTTP, только на loopback: сюда стучится локальный Caddy (см.
# backend/app/services/domains.py, panel_entry), когда проксирует внешний
# трафик с настоящим Let's Encrypt-сертификатом на PANEL_DOMAIN. TLS между
# Caddy и панелью тут не нужен — соединение никогда не покидает хост, а
# реальное шифрование для браузера уже терминирует сам Caddy.
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    client_max_body_size 0;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/nginx-locations.conf;
}
